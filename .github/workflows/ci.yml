name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests (no LLM, no network)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Import check (no API key needed)
        run: python -c "import factory, mvp; print(factory.app.name, mvp.app.name)"
      - run: python -m pytest -q -m "not integration"

  verify-cap:
    name: Verifier against cap-app (cds compile/build/serve)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cap-app/package-lock.json
      - run: pip install -r requirements-dev.txt
      - run: npm ci
        working-directory: cap-app
      - run: python -m pytest -q -m integration -rs
